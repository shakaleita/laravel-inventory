name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, sqlite3, pdo_sqlite
          coverage: none
      - name: Prepare writable Laravel directories
        run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP application source syntax
        run: find app routes database -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Composer dependency vulnerability audit
        run: composer audit --no-dev --format=plain
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Laravel feature tests
        run: ./vendor/bin/phpunit
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
